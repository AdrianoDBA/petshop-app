name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd backend
        npm ci
        cd ../frontend
        npm ci

    - name: Run backend tests
      run: |
        cd backend
        npm test

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Run security audit
      run: |
        cd backend
        npm audit --production
        cd ../frontend
        npm audit --production

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/petshop-backend:latest
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/petshop-backend:${{ github.sha }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/petshop-frontend:latest
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/petshop-frontend:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment"
        # Add your deployment logic here
        # For example, using SSH to connect to a server and docker-compose pull up
        # or using kubectl to update a Kubernetes deployment

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment completed"
        # Add notification logic (Slack, email, etc.) if desired